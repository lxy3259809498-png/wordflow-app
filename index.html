<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6d5efc" />
    <meta
      name="description"
      content="WordFlow — 以主动回忆、间隔复习和错词巩固为核心的本地优先英语背单词应用。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WordFlow" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>WordFlow · 让单词流动起来</title>
    <script>
      // Apply theme before paint to avoid a flash of the wrong palette.
      try {
        var stored = JSON.parse(localStorage.getItem('wordflow.theme') || 'null');
        var mode = stored && stored.mode ? stored.mode : 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
